<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังขาและรูปภาพอุปกรณ์ทุกชิ้น (SmartWatch Hardware Pinout Guide)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f131a;
            --card-bg: #1a202c;
            --card-border: #2d3748;
            --accent-blue: #3182ce;
            --accent-cyan: #00b4d8;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --accent-yellow: #d69e2e;
            --accent-purple: #805ad5;
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Prompt', sans-serif;
            padding: 24px;
            line-height: 1.6;
        }
        header {
            max-width: 1300px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px 36px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-badge {
            display: inline-block;
            background: rgba(49, 130, 206, 0.2);
            color: #63b3ed;
            border: 1px solid rgba(49, 130, 206, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 900px;
        }
        .toolbar {
            max-width: 1300px;
            margin: 0 auto 24px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
        }
        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            background: #1e2533;
            border: 1px solid #334155;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #1e2533;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Prompt', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
        }
        .components-grid {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 24px;
        }
        @media (max-width: 768px) {
            .components-grid {
                grid-template-columns: 1fr;
            }
        }
        .component-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .component-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            border-color: #4a5568;
        }
        .card-header {
            padding: 16px 20px;
            background: #1e2638;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-number {
            background: rgba(255,255,255,0.1);
            color: var(--accent-yellow);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        .card-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .tag-mcu { background: rgba(49, 130, 206, 0.2); color: #63b3ed; border: 1px solid #3182ce; }
        .tag-sensor { background: rgba(128, 90, 213, 0.2); color: #b794f4; border: 1px solid #805ad5; }
        .tag-display { background: rgba(56, 161, 105, 0.2); color: #68d391; border: 1px solid #38a169; }
        .tag-power { background: rgba(214, 158, 46, 0.2); color: #f6e05e; border: 1px solid #d69e2e; }
        .tag-discrete { background: rgba(229, 62, 62, 0.2); color: #fc8181; border: 1px solid #e53e3e; }
        .tag-switch { background: rgba(0, 180, 216, 0.2); color: #90e0ef; border: 1px solid #00b4d8; }
        .tag-protection { background: rgba(72, 187, 120, 0.2); color: #9ae6b4; border: 1px solid #48bb78; }
        .tag-passives { background: rgba(160, 174, 192, 0.2); color: #cbd5e0; border: 1px solid #718096; }

        .card-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .img-container {
            border-radius: 8px;
            overflow: hidden;
            background: #12161f;
            border: 1px solid #2d3748;
            cursor: pointer;
            position: relative;
        }
        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.2s;
        }
        .img-container:hover img {
            opacity: 0.92;
        }
        .img-zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }
        .component-meta {
            font-size: 13px;
            color: var(--text-muted);
            background: #141923;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-blue);
        }
        .component-meta strong {
            color: #e2e8f0;
        }
        .pin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .pin-table th {
            background: #242d3d;
            color: #cbd5e0;
            text-align: left;
            padding: 8px 10px;
            font-weight: 600;
            border-bottom: 2px solid #334155;
        }
        .pin-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #242d3d;
        }
        .pin-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .pin-badge {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--accent-yellow);
        }
        .net-badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(49, 130, 206, 0.15);
            color: #63b3ed;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        /* Modal for full size image view */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.88);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            max-width: 95%;
            max-height: 95%;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid #4a5568;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="header-badge">SMARTWATCH CARRIER BOARD V1.0 • HARDWARE PINOUT GUIDE</div>

    <p class="subtitle">

</div>

<div class="modal" id="imageModal" onclick="closeModal()">

    let currentFilter = 'all';

    function renderComponents() {
        const container = document.getElementById('gridContainer');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        container.innerHTML = '';

        components.forEach(item => {
            const matchesFilter = (currentFilter === 'all' || item.category === currentFilter);
            const matchesSearch = item.name.toLowerCase().includes(searchTerm) ||
                                  item.thai_name.toLowerCase().includes(searchTerm) ||
                                  item.pins.some(p => p.pin.toLowerCase().includes(searchTerm) || 
                                                      p.net.toLowerCase().includes(searchTerm) ||
                                                      p.dest.toLowerCase().includes(searchTerm));

            if (matchesFilter && matchesSearch) {
                const card = document.createElement('div');
                card.className = 'component-card';

                let tagClass = 'tag-passives';
                if (item.category === 'MCU') tagClass = 'tag-mcu';
                else if (item.category === 'Sensor') tagClass = 'tag-sensor';
                else if (item.category === 'Display') tagClass = 'tag-display';
                else if (item.category === 'Power') tagClass = 'tag-power';
                else if (item.category === 'Discrete') tagClass = 'tag-discrete';
                else if (item.category === 'Switch') tagClass = 'tag-switch';
                else if (item.category === 'Protection') tagClass = 'tag-protection';

                let pinRows = '';
                item.pins.forEach(p => {
                    pinRows += `
                        <tr>
                            <td class="pin-badge">${p.pin}</td>
                            <td><span class="net-badge">${p.net}</span></td>
                            <td style="color:#68d391">${p.dest}</td>
                            <td style="color:#a0aec0">${p.desc}</td>
                        </tr>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <span class="card-number">${item.num}</span>
                            <div class="card-title">${item.name}</div>
                        </div>
                        <span class="card-tag ${tagClass}">${item.category}</span>
                    </div>
                    <div class="card-body">
                        <div class="img-container" onclick="openModal('${item.img}')">
                            <img src="${item.img}" alt="${item.name} Pinout">
                            <div class="img-zoom-hint">🔍 คลิกเพื่อดูภาพขยายเต็มจอ</div>
                        </div>
                        <div class="component-meta">
                            <strong>หน้าที่:</strong> ${item.thai_name}<br>
                            <strong>ตัวถัง/ขั้ว:</strong> ${item.package}<br>
                            <span style="color:#cbd5e0">${item.desc}</span>
                        </div>
                        <table class="pin-table">
                            <thead>
                                <tr>
                                    <th>ขาพิน</th>
                                    <th>สัญญาณ (Net)</th>
                                    <th>ต่อเข้าจุดใด</th>
                                    <th>ฟังก์ชันหน้าที่</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${pinRows}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            }
        });
    }

    function setFilter(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderComponents();
    }

    function filterComponents() {
        renderComponents();
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('imageModal').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // Initial render
    renderComponents();
</script>
